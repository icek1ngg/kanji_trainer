<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#176b56" />
    <meta name="description" content="Luyện âm Hán Việt của Kanji trên thiết bị của bạn." />
    <title>Kanji Trainer · Luyện âm Hán Việt</title>
    <script>
      try {
        const theme = localStorage.getItem('kanji-theme');
        document.documentElement.dataset.theme = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
